name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *' # Run every 5 minutes to be safe against provider delays
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          echo "Pinging https://ai-call-analyzer.onrender.com/ to keep it awake..."
          curl -I https://ai-call-analyzer.onrender.com/
